[project]
name = "media-on-terminal"
dynamic = ["version"]
description = "终端多媒体播放器，支持音乐/视频播放、歌词显示、在线搜索下载和文件浏览"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "PL", "RUF", "S",
]
ignore = [
    "S101",     # assert in tests
    "S603",     # subprocess for ffplay/ffmpeg
    "S607",     # partial paths (system media players)
    "PLR0913",  # UI functions may have many params
    "PLR0915",  # complex playback control logic
    "PLR2004",  # media constants as magic values
]

[tool.ruff.lint.isort]
known-first-party = ["mp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
